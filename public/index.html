<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Foothill Cabs · Book a ride from Siliguri</title><meta name="description" content="Explore local cabs, airport transfers and hill trips from Siliguri. Choose a departure and book a private cab."><link rel="icon" href="/mark.svg"><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body>
<header><div class="wrap head"><a class="brand" href="/" aria-label="Foothill Cabs home"><img src="/mark.svg" width="36" height="36" alt=""><span data-brand>Foothill Cabs</span></a><nav aria-label="Main navigation"><a href="#booking" class="nav-active">Book a ride</a><a href="#routes">Routes</a></nav><div class="head-right"><button class="help" id="help"><svg class="icon" aria-hidden="true"><use href="/icons.svg#help"/></svg><span>Help</span></button><button class="bookings" id="bookings"><svg class="icon" aria-hidden="true"><use href="/icons.svg#book"/></svg><span>My bookings</span></button></div></div></header>
<main class="wrap"><section class="hero" id="booking"><div class="booking-panel"><div class="kicker"><span></span>SILIGURI CAB SERVICE</div><h1>Book your ride<span>.</span></h1><p class="intro">Private cabs for airport transfers, city rides and the hills.</p>
<div class="tabs" id="tabs" aria-label="Trip type"><button data-type="Airport" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="/icons.svg#airport"/></svg> Airport</button><button data-type="Local" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="/icons.svg#city"/></svg> Local</button><button data-type="Hills" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="/icons.svg#mountain"/></svg> Hills</button></div>
<form id="search"><div class="places"><label><span class="point start"></span><span class="place-text"><small>Pickup location</small><select id="origin" aria-label="Pickup location" required></select></span></label><label><span class="point end"></span><span class="place-text"><small>Drop location</small><select id="destination" aria-label="Drop location" required></select></span></label></div><div class="schedule"><label><svg class="icon" aria-hidden="true"><use href="/icons.svg#cal"/></svg><span><small>Pickup date</small><input id="date" type="date" aria-label="Pickup date" required></span></label><label><svg class="icon" aria-hidden="true"><use href="/icons.svg#clock"/></svg><span><small>Pickup time</small><select id="time" aria-label="Earliest pickup time"><option value="">Any time</option><option value="06:00">After 6 AM</option><option value="09:00">After 9 AM</option><option value="12:00">After 12 PM</option><option value="15:00">After 3 PM</option><option value="18:00">After 6 PM</option></select></span></label></div><button class="primary search" id="find"><svg class="icon" aria-hidden="true"><use href="/icons.svg#search"/></svg>Find a cab</button></form></div>
<div class="scenic"><img id="hero-image" src="/images/hero.jpg" alt="A winding road through green Himalayan foothills" fetchpriority="high"><div class="scenic-caption"><span class="photo-tag"><svg class="icon" aria-hidden="true"><use href="/icons.svg#pin"/></svg> Destination spotlight</span><h2>Darjeeling</h2><p>West Bengal, India</p></div><button id="spotlight" class="photo-button">Explore route</button></div></section>
<section id="routes" class="routes"><div class="section-head"><div><div class="kicker"><span></span>EXPLORE THE REGION</div><h2>Popular routes</h2></div><button id="viewall" class="outline"><svg class="icon" aria-hidden="true"><use href="/icons.svg#filter"/></svg>All routes</button></div><div id="route-grid" class="route-grid"></div></section></main>
<footer><div class="wrap foot"><a class="brand" href="/" aria-label="Foothill Cabs home"><img src="/mark.svg" width="36" height="36" alt=""><span data-brand>Foothill Cabs</span></a><a href="/admin">Owner panel</a></div></footer>
<dialog id="dialog"><div class="dialog-head"><h2 id="modal-title"></h2><button id="close" class="icon-btn" aria-label="Close"><svg class="icon" aria-hidden="true"><use href="/icons.svg#close"/></svg></button></div><div id="modal-body"></div></dialog></body></html>
